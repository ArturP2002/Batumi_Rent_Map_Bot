[project]
name = "batumi-rent-map"
version = "0.1.0"
description = "Batumi Rent Map — Telegram bot + Mini App backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "geoalchemy2>=0.15.2",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "aiogram>=3.15.0",
  "redis>=5.2.0",
  "boto3>=1.35.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "Pillow>=11.0.0",
  "openpyxl>=3.1.5",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
